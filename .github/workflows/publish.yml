name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install -e .[dev]
          python -m ruff check .
          python -m mypy lobesync
          python -m pytest
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* scripts/install.sh scripts/install.ps1 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --title "Lobesync $GITHUB_REF_NAME" \
            --generate-notes \
            dist/* scripts/install.sh scripts/install.ps1 SHA256SUMS
