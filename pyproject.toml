[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobesync"
version = "0.1.1"
description = "Personal AI assistant for tasks, notes, memories, and checklists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.1.6",
    "sqlmodel>=0.0.38",
    "rich>=14.3.3",
    "python-dotenv>=1.2.2",
    "keyring>=25.0",
    "questionary>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[project.scripts]
lobesync = "lobesync.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lobesync*"]
exclude = [".venv*", "__pycache__*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lobesync"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
